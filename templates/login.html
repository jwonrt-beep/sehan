<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0F1117">
  <title>로그인 | 재고관리 시스템</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div id="toast-container"></div>

  <div class="login-page">
    <div class="login-box">
      <div class="login-logo">
        <div class="logo-icon"> <img src="./static/SAEHANLOGO.png" width="200" height="200"></div>
        <h1>세한로보틱스 재고관리 시스템</h1>
        <p>직원 계정으로 로그인하세요</p>
      </div>

      <div class="login-card">
        {% if error %}
        <div class="login-error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
          <div class="form-group">
            <label class="form-label" for="username">아이디</label>
            <input id="username" name="username" type="text" class="form-control" placeholder="아이디를 입력하세요"
              autocomplete="username" required autofocus>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">비밀번호</label>
            <input id="password" name="password" type="password" class="form-control" placeholder="비밀번호를 입력하세요"
              autocomplete="current-password" required>
          </div>
          <button type="submit" class="login-btn">로그인</button>
        </form>
      </div>

      <div class="login-footer">
        © 2026 재고관리 시스템. 문의: 관리자에게 연락하세요.
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>

</html>
